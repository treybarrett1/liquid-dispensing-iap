; Compile-only toolchain check, not dispenser firmware or a display bring-up.
; Platform and display libraries follow ELECROW's V1.2/V1.3 example.
; The physical board revision remains unconfirmed.
[env:esp32s3-check]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DLV_CONF_SKIP
lib_deps =
    lvgl/lvgl@9.1.0
    lovyan03/LovyanGFX@1.2.26
    tamctec/TAMC_GT911@1.0.2
    bogde/HX711@0.7.5
